        // When search box is focused, select all text
        document.addEventListener("DOMContentLoaded", function() {
            const searchBox = document.getElementById("songSearch");
            
            const urlParams = new URLSearchParams(window.location.search);
            let searchQuery = urlParams.get('search');
            
            // Support hash-based search for better SEO and snippets
            if (!searchQuery && window.location.hash) {
                if (window.location.hash.startsWith('#search=')) {
                    searchQuery = decodeURIComponent(window.location.hash.substring(8));
                } else if (window.location.hash.startsWith('#songSearch=')) {
                    searchQuery = decodeURIComponent(window.location.hash.substring(12));
                }
            }

            if (searchQuery) {
                searchBox.value = searchQuery;
                // Defer the filtering slightly to ensure the list is ready
                setTimeout(filterSongs, 100);
            }

            // Handle back/forward navigation or hash changes on the same page
            window.addEventListener('hashchange', function() {
                let newQuery = null;
                if (window.location.hash.startsWith('#search=')) {
                    newQuery = decodeURIComponent(window.location.hash.substring(8));
                } else if (window.location.hash.startsWith('#songSearch=')) {
                    newQuery = decodeURIComponent(window.location.hash.substring(12));
                }
                
                if (newQuery !== null) {
                    searchBox.value = newQuery;
                    filterSongs();
                }
                if (typeof checkSongbookFromUrl === 'function') {
                    checkSongbookFromUrl();
                }
            });

            if (typeof checkSongbookFromUrl === 'function') {
                checkSongbookFromUrl();
            }

            searchBox.addEventListener("focus", function() {
                searchBox.select();
            });
            const beforeSearch = document.getElementById("before-search");
            beforeSearch.scrollIntoView({ behavior: 'instant' });
        });

        // Focus search bar on keypress
        document.addEventListener("keypress", function(event) {
            const beforeSearch = document.getElementById("before-search");
            beforeSearch.scrollIntoView({ behavior: 'instant' });

            const searchBox = document.getElementById("songSearch");
            // If the search box is not focused, focus it
            if (document.activeElement.id !== 'songSearch') {
                searchBox.focus();
            }
            
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent form submission
                filterSongs(); // Call the search function
                // If there is only one song, open it directly
                const songsList = document.getElementById("songs");
        
                // Count the number of songs in the list that are visible
                let visibleSongsCount = 0;
                let firstSong = null;
                for (let i = 0; i < songsList.children.length; i++) {
                    const songItem = songsList.children[i];
                    if (songItem.style.display !== 'none') {
                        visibleSongsCount++;
                        if (!firstSong) {
                          firstSong = songItem; // Keep track of the first visible song
                        }
                    }
                }
                if (visibleSongsCount === 1 && firstSong) {
                    const songLink = firstSong.querySelector("a");
                    if (songLink) {
                        let href = songLink.getAttribute("href");
                        if (href) {
                            if (typeof activeSongbookFilter !== 'undefined' && activeSongbookFilter && activeSongbookFilter.id) {
                                const sep = href.includes('?') ? '&' : '?';
                                href = `${href}${sep}songbook=${encodeURIComponent(activeSongbookFilter.id)}`;
                            }
                            window.location.href = href; // Navigate to the song
                        }
                    }
                }
            }
        })
